stages:
  train_initial_model:
    cmd: python app/model/src/train.py app/pkl_models
    deps:
    - app/model/src/train.py
    - data-pull/data/
    params:
    - train.age_bucket
    - train.mid_rating_watch_over
    - train.data_path
    - train.tag
    - train.num_warm_users
    outs:
    - app/pkl_models/content_based_model_Initial_Model.pkl

  train_updated_model:
    cmd: python app/model/src/train.py app/pkl_models
    deps:
    - app/model/src/train.py
    - data-pull/data/
    params:
    - train.age_bucket
    - train.mid_rating_watch_over
    - train.data_path
    - train.tag
    - train.num_warm_users
    outs:
    - app/pkl_models/content_based_model_Updated_Model.pkl
